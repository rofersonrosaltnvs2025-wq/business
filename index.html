<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now</title>
    <!-- Tailwind CSS CDN para sa styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white p-6 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <span>📅</span> Book Now!
                </h2>
                <p class="text-slate-400 text-xs mt-1">Fill in the details below to reserve your seat</p>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 block">Rate per seat</span>
                <span class="text-xl font-extrabold text-amber-400">₱750</span>
            </div>
        </div>

        <!-- Form -->
        <form id="bookingForm" class="p-6 space-y-4" onsubmit="handleBooking(event)">
            
            <!-- Full Name -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">👤</span>
                    <input type="text" id="fullName" name="fullName" required placeholder="e.g. Juan Dela Cruz" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white text-sm">
                </div>
            </div>

            <!-- Mobile Number -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mobile / Contact Number *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">📱</span>
                    <input type="tel" id="mobileNumber" name="mobileNumber" required placeholder="e.g. 09171234567" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white text-sm">
                </div>
            </div>

            <!-- Pickup Address -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Pickup Address (Door-to-Door) *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">📍</span>
                    <input type="text" id="pickupAddress" name="pickupAddress" required placeholder="House No., Street, Barangay, City" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white text-sm">
                </div>
            </div>

            <!-- Destination / Route -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Destination / Route *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">🔀</span>
                    <select id="destinationSelect" name="destination" required 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white text-sm"
                        onchange="updateDestinationSummary(); checkAvailability();">
                        <option value="To Wawa Port">To Wawa Port</option>
                        <option value="From Wawa Port">From Wawa Port</option>
                        <option value="To Calatagan">To Calatagan</option>
                        <option value="From Calatagan">From Calatagan</option>
                    </select>
                </div>
            </div>

            <!-- Travel Date & Number of Passengers -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Travel Date *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">📅</span>
                        <input type="date" id="travelDate" name="travelDate" required 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white text-sm"
                            onchange="checkAvailability()">
                    </div>
                    <!-- Dito lalabas ang availability notice -->
                    <div id="availabilityNotice" class="mt-1.5 text-xs font-semibold hidden"></div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Number of Passengers (Max 6) *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">👥</span>
                        <select id="passengersCount" name="passengersCount" 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white text-sm"
                            onchange="updateTotalAmount()">
                            <option value="1">1 Passenger</option>
                            <option value="2">2 Passengers</option>
                            <option value="3">3 Passengers</option>
                            <option value="4">4 Passengers</option>
                            <option value="5">5 Passengers</option>
                            <option value="6">6 Passengers</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Summary Box -->
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 flex justify-between items-center">
                <div>
                    <span class="text-xs text-slate-500 block">Destination</span>
                    <span id="summaryDestination" class="text-sm font-bold text-slate-800">To Wawa Port</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-500 block">Total Amount</span>
                    <span id="totalAmountDisplay" class="text-lg font-extrabold text-primary">₱750</span>
                </div>
            </div>

            <!-- Terms and Conditions -->
            <div class="flex items-start gap-2 pt-2">
                <input type="checkbox" id="terms" name="terms" required class="mt-1 rounded border-slate-300 text-primary focus:ring-primary">
                <label for="terms" class="text-xs text-slate-600">
                    I agree to the <a href="#" class="text-primary underline">Terms & Conditions</a>, <a href="#" class="text-primary underline">Refund Policy</a>, and <a href="#" class="text-primary underline">Privacy Policy</a>.
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-sky-400 hover:bg-sky-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-sky-100">
                <span>✈️</span> Confirm Booking
            </button>

        </form>
    </div>

    <!-- JavaScript Section -->
    <script>
        // Palitan ito ng iyong Google Apps Script Web App URL
        const GOOGLE_SHEET_WEBHOOK_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
        let currentAvailableSeats = 6;

        // Mag-update ng summary display sa form kapag pinalitan ang route
        function updateDestinationSummary() {
            const select = document.getElementById('destinationSelect');
            const summary = document.getElementById('summaryDestination');
            summary.innerText = select.value;
        }

        // Mag-compute ng total amount base sa bilang ng pasahero
        function updateTotalAmount() {
            const count = parseInt(document.getElementById('passengersCount').value) || 1;
            const total = count * 750;
            document.getElementById('totalAmountDisplay').innerText = `₱${total.toLocaleString()}`;
        }

        // I-check ang availability sa Google Sheet base sa date at destination
        async function checkAvailability() {
            const selectedDate = document.getElementById('travelDate').value;
            const selectedDestination = document.getElementById('destinationSelect').value;
            const noticeBox = document.getElementById('availabilityNotice');
            const submitBtn = document.getElementById('submitBtn');

            if (!selectedDate) return;

            noticeBox.className = "mt-1.5 text-xs font-semibold text-slate-500";
            noticeBox.innerText = "Checking seat availability...";
            noticeBox.classList.remove('hidden');

            try {
                const response = await fetch(`${GOOGLE_SHEET_WEBHOOK_URL}?date=${selectedDate}&destination=${encodeURIComponent(selectedDestination)}`);
                const data = await response.json();
                
                currentAvailableSeats = data.availableSeats !== undefined ? data.availableSeats : 6;

                if (currentAvailableSeats <= 0) {
                    noticeBox.className = "mt-1.5 text-xs font-semibold text-red-600";
                    noticeBox.innerText = "❌ FULLY BOOKED for this date and route. Please choose another date.";
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    noticeBox.className = "mt-1.5 text-xs font-semibold text-emerald-600";
                    noticeBox.innerText = `✅ ${currentAvailableSeats} of 6 seats available for this route.`;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            } catch (err) {
                console.error("Error checking seats:", err);
                noticeBox.className = "mt-1.5 text-xs font-semibold text-slate-500";
                noticeBox.innerText = "Seats status: Proceed to confirm booking.";
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Handle form submission papunta sa Google Sheet
        async function handleBooking(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing Booking...";

            const formData = {
                fullName: document.getElementById('fullName').value,
                mobileNumber: document.getElementById('mobileNumber').value,
                pickupAddress: document.getElementById('pickupAddress').value,
                destination: document.getElementById('destinationSelect').value,
                travelDate: document.getElementById('travelDate').value,
                passengersCount: document.getElementById('passengersCount').value,
                totalAmount: document.getElementById('passengersCount').value * 750
            };

            try {
                await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                alert("🎉 Booking successfully confirmed!");
                document.getElementById('bookingForm').reset();
                document.getElementById('availabilityNotice').classList.add('hidden');
                updateDestinationSummary();
                updateTotalAmount();
            } catch (error) {
                console.error('Error:', error);
                alert("❌ There was an error processing your booking. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm Booking";
            }
        }
    </script>
</body>
</html>
