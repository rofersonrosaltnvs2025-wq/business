<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROFS Transportation Services - Booking</title>
  <!-- Bootstrap CSS para sa magandang disenyo -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hero-section { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; padding: 40px 20px; text-align: center; }
    .booking-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 30px; margin-top: -30px; }
  </style>
</head>
<body>

  <!-- Header / Hero -->
  <div class="hero-section">
    <h2>ROFS TRANSPORTATION SERVICES</h2>
    <p>7-Seater MPV Service: San Juan, Marikina, San Mateo Rizal, Montalban</p>
  </div>

  <!-- Booking Form Container -->
  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 booking-card">
        <h4 class="mb-4">Book Now! <span class="float-end fs-6 text-warning">Rate per seat: ₱750</span></h4>
        
        <form id="bookingForm">
          <!-- Full Name -->
          <div class="mb-3">
            <label for="fullName" class="form-label">FULL NAME *</label>
            <input type="text" class="form-control" id="fullName" placeholder="e.g. Juan Dela Cruz" required>
          </div>

          <!-- Mobile / Contact Number -->
          <div class="mb-3">
            <label for="phoneNumber" class="form-label">MOBILE / CONTACT NUMBER *</label>
            <input type="tel" class="form-control" id="phoneNumber" placeholder="e.g. 09171234567" required>
          </div>

          <!-- Pickup Address -->
          <div class="mb-3">
            <label for="pickupAddress" class="form-label">PICKUP ADDRESS (DOOR-TO-DOOR) *</label>
            <input type="text" class="form-control" id="pickupAddress" placeholder="House No., Street, Barangay, City" required>
          </div>

          <!-- Destination / Route Selection -->
          <div class="mb-3">
            <label for="destinationSelect" class="form-label">DESTINATION / ROUTE *</label>
            <select id="destinationSelect" class="form-select" required>
              <option value="Pickup Location > Wawa Port">Pickup Location > Wawa Port</option>
              <option value="Wawa Port > Your Drop off location">Wawa Port > Your Drop off location</option>
              <option value="Pickup Location > Calatagan Port">Pickup Location > Calatagan Port</option>
              <option value="Calatagan Port > Your Drop off Location">Calatagan Port > Your Drop off Location</option>
            </select>
          </div>

          <!-- Travel Date & Passengers -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="travelDate" class="form-label">TRAVEL DATE *</label>
              <input type="date" class="form-control" id="travelDate" required>
              <div id="seatStatusMessage" class="form-text mt-2"></div>
            </div>

            <div class="col-md-6 mb-3">
              <label for="passengersCount" class="form-label">NUMBER OF PASSENGERS (MAX 6) *</label>
              <select class="form-select" id="passengersCount">
                <option value="1">1 Passenger</option>
                <option value="2">2 Passengers</option>
                <option value="3">3 Passengers</option>
                <option value="4">4 Passengers</option>
                <option value="5">5 Passengers</option>
                <option value="6">6 Passengers</option>
              </select>
            </div>
          </div>

          <!-- Summary Box -->
          <div class="p-3 bg-light rounded mb-3 d-flex justify-content-between align-items-center">
            <div>
              <small class="text-muted">Selected Route</small>
              <div id="displayRoute" class="fw-bold text-primary">Pickup Location > Wawa Port</div>
            </div>
            <div class="text-end">
              <small class="text-muted">Total Amount</small>
              <div id="totalAmountDisplay" class="fw-bold fs-5 text-dark">₱750</div>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2">Confirm Booking</button>
        </form>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Ilagay dito ang iyong bagong Google Apps Script Web App URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxt-k7bz_3EeWDUqD_GzJcImY0uzn4TGoLF0565KHu1yY65O-IHBV6ImdIwTRyOydND/exec";

    const travelDateInput = document.getElementById('travelDate');
    const destinationSelect = document.getElementById('destinationSelect');
    const passengersSelect = document.getElementById('passengersCount');
    const displayRoute = document.getElementById('displayRoute');
    const totalAmountDisplay = document.getElementById('totalAmountDisplay');
    const seatStatusMessage = document.getElementById('seatStatusMessage');
    const submitBtn = document.getElementById('submitBtn');

    // Update Display Route and Total Amount on change
    destinationSelect.addEventListener('change', function() {
      displayRoute.innerText = this.value;
      checkAvailability();
    });

    passengersSelect.addEventListener('change', function() {
      const total = this.value * 750;
      totalAmountDisplay.innerText = "₱" + total.toLocaleString();
    });

    travelDateInput.addEventListener('change', checkAvailability);

    async function checkAvailability() {
      const date = travelDateInput.value;
      const destination = destinationSelect.value;
      
      if (!date) return;

      seatStatusMessage.innerHTML = "<span class='text-muted'>Checking available seats...</span>";
      
      try {
        const response = await fetch(`${WEB_APP_URL}?date=${date}&destination=${encodeURIComponent(destination)}`);
        const data = await response.json();
        
        if (data.availableSeats <= 0) {
          seatStatusMessage.innerHTML = `<span class='text-danger fw-bold'>✖ FULLY BOOKED for this date. (0 slots left)</span>`;
          submitBtn.disabled = true;
          submitBtn.classList.add('btn-secondary');
          submitBtn.classList.remove('btn-primary');
        } else {
          seatStatusMessage.innerHTML = `<span class='text-success fw-bold'>✔ Available Seats: ${data.availableSeats} left</span>`;
          submitBtn.disabled = false;
          submitBtn.classList.add('btn-primary');
          submitBtn.classList.remove('btn-secondary');
        }
      } catch (error) {
        console.error("Error checking seats:", error);
        seatStatusMessage.innerHTML = "<span class='text-danger'>Error checking availability.</span>";
      }
    }

    // Handle Form Submit
    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting Booking...";

      const bookingData = {
        bookingId: "BOOK-" + Math.floor(10000 + Math.random() * 90000),
        customerName: document.getElementById('fullName').value,
        phone: document.getElementById('phoneNumber').value,
        pickupAddress: document.getElementById('pickupAddress').value,
        destination: destinationSelect.value,
        travelDate: travelDateInput.value,
        passengers: parseInt(passengersSelect.value),
        totalAmount: passengersSelect.value * 750
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(bookingData)
        });
        const result = await response.json();
        
        if (result.result === "success") {
          alert("Booking submitted successfully! Thank you.");
          window.location.reload();
        } else {
          alert("Something went wrong. Please try again.");
          submitBtn.disabled = false;
          submitBtn.innerText = "Confirm Booking";
        }
      } catch (err) {
        console.error("Error submitting:", err);
        alert("Connection error. Please try again.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Confirm Booking";
      }
    });
  </script>
</body>
</html>
